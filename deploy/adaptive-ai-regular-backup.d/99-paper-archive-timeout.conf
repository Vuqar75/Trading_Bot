[Service]
# Leave the hourly timer and CPU/memory constraints in place. The bracket
# archive requires enough time for consistent SQLite I/O and full restore.
# Full integrity_check on a cold restore exceeded the 24-minute budget.
TimeoutStartSec=40min
ExecStopPost=/usr/bin/python3 -B /opt/tradingbot-ai-brackets-backup/backup.py --cleanup
